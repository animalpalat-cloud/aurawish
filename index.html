    <!-- 
      PERFORMANCE OPTIMIZED FONT LOADING
      
      Strategy:
      1. CRITICAL: Outfit (primary UI font) - preloaded with font-display: swap
      2. DEFERRED: Playfair Display - loads async with swap, only used in specific sections
      3. LAZY: All other fonts (Cinzel, Dancing Script, Great Vibes, etc.) load on-demand via fontsData.js
      
      Why font-display: swap?
      - Shows text immediately with fallback font (no invisible text)
      - Swaps to custom font when loaded (no flash of invisible text)
      - Critical for LCP/FCP performance on slow connections
    -->
    
    <!-- Preconnect to Google Fonts (DNS + TLS handshake before font request) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Preconnect to image CDN for faster LCP image loading -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
    
    <!-- Preconnect to Firebase auth for users who sign in with Google.
         Saves ~310ms handshake latency when the auth popup opens.
         Low priority preconnect — browser queues it after critical resources. -->
    <link rel="preconnect" href="https://aurawish-dbd78.firebaseapp.com" crossorigin>
    
    <!-- CRITICAL: Preload LCP image at correct mobile size (320w for ~286px display slot).
         Using 320w avoids downloading the 760w version Lighthouse was flagging. -->
    <link rel="preload" as="image" href="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=320&auto=format&fit=crop&q=80" fetchpriority="high" imagesrcset="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=320&auto=format&fit=crop&q=80 320w, https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=380&auto=format&fit=crop&q=75 380w" imagesizes="(max-width: 640px) 286px, 380px">
    
    <!-- CRITICAL: Primary UI font (Outfit) - preload for immediate availability -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'">
    
    <!-- DEFERRED: Playfair Display (display font) - async load with low priority -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&display=swap" media="print" onload="this.media='all'">
